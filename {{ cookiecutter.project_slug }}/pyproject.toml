[project]
name = "{{cookiecutter.project_name}}"
version = "0.1.0"
description = "Infra project template with MkDocs, Python, Makefile and Confluence export"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
